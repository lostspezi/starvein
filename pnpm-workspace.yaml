packages:
  - "."
  - "apps/*"
  - "packages/*"

# Transitive Pakete mit High-Advisories, deren Konsumenten noch keine
# gepatchte Version anfordern. Bewusst auf die jeweilige Major-Linie
# begrenzt, damit kein Konsument ungewollt eine neue Major bekommt.
# Override jeweils entfernen, sobald der genannte Konsument selbst eine
# gepatchte Version mitbringt.
# nanoid 3.x <3.3.18: GHSA-2v37-7h3g-55p8 — via postcss (next).
# undici 7.x <7.29.0: GHSA-4cwx-7wf7-3272 — via jsdom (better-auth → vitest);
# jsdom 29 verlangt undici 7, daher nicht auf 8 heben.
# browserslist 4.x <4.28.7: GHSA-c83g-rgw3-j3cx und GHSA-73wf-gq98-2v4g — via
# @babel/helper-compilation-targets.
overrides:
  "nanoid@3": ">=3.3.18 <4"
  "undici@7": ">=7.29.0 <8"
  "browserslist@4": ">=4.28.7 <5"

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  mongodb-memory-server: true
  "@parcel/watcher": true
  "@swc/core": true
  msw: true
  # transitiv via @scalar/api-reference (devDep) — Postinstall wählt nur
  # den Vue-2/3-Entry; wir nutzen ausschließlich das fertige
  # Standalone-Bundle, kein Build nötig.
  vue-demi: false
